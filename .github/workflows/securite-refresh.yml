name: Sécurité refresh (city_external_kpis)

# Recalcule l'indicateur de sécurité composite par commune, depuis la base
# statistique communale de la délinquance (Interstats, Ministère de
# l'Intérieur). La source est mise à jour plusieurs fois par an : refresh
# trimestriel.

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *" # 1er janvier/avril/juillet/octobre, 6h UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.2" "supabase>=2.9" "requests>=2.31"

      - name: Run sécurité refresh
        id: run
        run: python3 scripts/process-securite.py --upload
        env:
          SUPABASE_URL: https://zjsflhzeujcujjqqantc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notifier par email (succès ou échec)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            export SUBJECT="✅ lokt.fr — refresh sécurité OK"
            export BODY_TEXT="Le refresh trimestriel de l'indicateur de sécurité par commune (Interstats) s'est terminé avec succès.

Logs : ${RUN_URL}"
          else
            export SUBJECT="🚨 lokt.fr — le refresh sécurité a échoué"
            export BODY_TEXT="Le refresh trimestriel de l'indicateur de sécurité par commune a échoué.

Logs : ${RUN_URL}"
          fi
          curl -s -o /dev/null -w "Resend: %{http_code}\n" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg from "lokt.fr <contact@lokt.fr>" --arg to "matthieu.turbier@gmail.com" --arg subject "$SUBJECT" --arg text "$BODY_TEXT" '{from:$from,to:$to,subject:$subject,text:$text}')"
