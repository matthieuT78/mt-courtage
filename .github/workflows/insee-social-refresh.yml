name: INSEE social refresh (city_external_kpis)

# Recalcule revenu médian, population et vacance/résidences secondaires par
# commune, depuis le recensement + Filosofi INSEE (mise à jour ~annuelle).
# Tourne sur GitHub Actions plutôt que Vercel : télécharge un parquet de
# ~1,9 Go, hors de portée d'une fonction serverless Node.

on:
  schedule:
    - cron: "0 6 1 3 *" # 1er mars, 6h UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.2" "supabase>=2.9" "pyarrow>=15"

      - name: Run INSEE social refresh
        id: run
        run: python3 scripts/process-insee-social.py --upload
        env:
          SUPABASE_URL: https://zjsflhzeujcujjqqantc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notifier par email (succès ou échec)
        # Ce job ne tourne qu'1x/an : sans ce mail, il est facile d'oublier
        # qu'il existe et de ne pas remarquer un échec.
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            export SUBJECT="✅ lokt.fr — refresh INSEE (revenus/population) OK"
            export BODY_TEXT="Le refresh automatique INSEE (revenu médian, population, vacance/résidences secondaires) s'est terminé avec succès.

Logs : ${RUN_URL}"
          else
            export SUBJECT="🚨 lokt.fr — le refresh INSEE a échoué"
            export BODY_TEXT="Le refresh automatique INSEE (revenu médian, population, vacance) a échoué.

Logs : ${RUN_URL}"
          fi
          curl -s -o /dev/null -w "Resend: %{http_code}\n" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg from "lokt.fr <contact@lokt.fr>" --arg to "matthieu.turbier@gmail.com" --arg subject "$SUBJECT" --arg text "$BODY_TEXT" '{from:$from,to:$to,subject:$subject,text:$text}')"
