name: DVF refresh (city_market_benchmarks)

# Recalcule city_market_benchmarks (prix médian au m² + loyer estimé, par
# commune) depuis les données DVF officielles (files.data.gouv.fr/geo-dvf),
# publiées semestriellement en avril et octobre. Tourne ici plutôt que sur
# un cron Vercel/cron-job.org : le traitement (téléchargement ~90 Mo,
# agrégation de ~3,5M lignes avec pandas) dépasse largement ce qu'une
# fonction serverless Node peut faire dans ses limites de temps/mémoire.

on:
  schedule:
    - cron: "0 6 20 4,10 *" # 20 avril et 20 octobre, 6h UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Année DVF à traiter (vide = auto-détection de la dernière année disponible)"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.2" "supabase>=2.9"

      - name: Determine target year
        id: target
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            echo "year=${{ github.event.inputs.year }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Le proxy nginx de files.data.gouv.fr renvoie toujours 302, même
          # pour une année inexistante (il redirige vers l'objet S3 sous-jacent
          # sans vérifier qu'il existe) : -L est indispensable pour que -f
          # échoue réellement sur le 404 final renvoyé par S3.
          CURRENT_YEAR=$(date +%Y)
          if curl -sfIL "https://files.data.gouv.fr/geo-dvf/latest/csv/${CURRENT_YEAR}/full.csv.gz" > /dev/null; then
            echo "year=${CURRENT_YEAR}" >> "$GITHUB_OUTPUT"
          elif curl -sfIL "https://files.data.gouv.fr/geo-dvf/latest/csv/$((CURRENT_YEAR - 1))/full.csv.gz" > /dev/null; then
            echo "year=$((CURRENT_YEAR - 1))" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun fichier geo-dvf disponible pour ${CURRENT_YEAR} ni $((CURRENT_YEAR - 1))." >&2
            exit 1
          fi

      - name: Run DVF refresh
        run: python3 scripts/process-dvf.py --year ${{ steps.target.outputs.year }} --upload --history --rooms
        env:
          # Pas un secret : c'est l'URL publique du projet Supabase, déjà
          # embarquée telle quelle dans le bundle JS du site (NEXT_PUBLIC_).
          SUPABASE_URL: https://zjsflhzeujcujjqqantc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload result CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-market-benchmarks-${{ steps.target.outputs.year }}
          path: data/city_market_benchmarks_from_dvf_*.csv
          retention-days: 90

      - name: Notifier par email (succès ou échec)
        # Ce job ne tourne que 2x/an (avril, octobre) : sans ce mail, il est
        # facile d'oublier qu'il existe et de ne pas remarquer un échec.
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_YEAR: ${{ steps.target.outputs.year }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            export SUBJECT="✅ lokt.fr — refresh DVF OK (année ${TARGET_YEAR:-?})"
            export BODY_TEXT="Le refresh automatique DVF (city_market_benchmarks + historique) s'est terminé avec succès pour l'année ${TARGET_YEAR:-?}.

Logs : ${RUN_URL}"
          else
            export SUBJECT="🚨 lokt.fr — le refresh DVF a échoué"
            export BODY_TEXT="Le refresh automatique DVF a échoué (année ciblée : ${TARGET_YEAR:-inconnue, échec probable avant la détection de l'année}).

Logs : ${RUN_URL}"
          fi
          curl -s -o /dev/null -w "Resend: %{http_code}\n" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg from "lokt.fr <contact@lokt.fr>" --arg to "matthieu.turbier@gmail.com" --arg subject "$SUBJECT" --arg text "$BODY_TEXT" '{from:$from,to:$to,subject:$subject,text:$text}')"
