name: Score investissement refresh (city_external_kpis)

# Recalcule le Score lokt.fr (0-100, potentiel d'investissement locatif)
# à partir des données déjà en base (DVF, loyers officiels, DPE, INSEE).
# Tourne chaque semaine : les sources sous-jacentes changent lentement
# (DVF semestriel, DPE trimestriel, INSEE/loyers annuel), donc un
# hebdomadaire suffit largement à rester à jour sans recalcul inutile.

on:
  schedule:
    - cron: "0 7 * * 1" # chaque lundi, 7h UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.2" "supabase>=2.9"

      - name: Run investment score refresh
        id: run
        run: python3 scripts/compute-investment-scores.py --upload
        env:
          SUPABASE_URL: https://zjsflhzeujcujjqqantc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notifier par email (succès ou échec)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            export SUBJECT="✅ lokt.fr — refresh Score investissement OK"
            export BODY_TEXT="Le recalcul hebdomadaire du Score lokt.fr (potentiel d'investissement locatif par commune) s'est terminé avec succès.

Logs : ${RUN_URL}"
          else
            export SUBJECT="🚨 lokt.fr — le refresh Score investissement a échoué"
            export BODY_TEXT="Le recalcul hebdomadaire du Score lokt.fr a échoué.

Logs : ${RUN_URL}"
          fi
          curl -s -o /dev/null -w "Resend: %{http_code}\n" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg from "lokt.fr <contact@lokt.fr>" --arg to "matthieu.turbier@gmail.com" --arg subject "$SUBJECT" --arg text "$BODY_TEXT" '{from:$from,to:$to,subject:$subject,text:$text}')"
