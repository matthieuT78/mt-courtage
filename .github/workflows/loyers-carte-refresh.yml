name: Carte des loyers refresh (city_external_kpis)

# Recalcule le loyer d'annonce prédit par commune (appartement/maison),
# depuis la "Carte des loyers" (DGALN/ANIL/INRAE), republiée annuellement
# (constaté en décembre pour l'édition N). Le script résout lui-même
# l'édition la plus récente disponible sur data.gouv.fr.

on:
  schedule:
    - cron: "0 6 15 1 *" # 15 janvier, 6h UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.2" "supabase>=2.9" "requests>=2.31"

      - name: Run Carte des loyers refresh
        id: run
        run: python3 scripts/process-loyers-carte.py --upload
        env:
          SUPABASE_URL: https://zjsflhzeujcujjqqantc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notifier par email (succès ou échec)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            export SUBJECT="✅ lokt.fr — refresh Carte des loyers OK"
            export BODY_TEXT="Le refresh automatique de la Carte des loyers (DGALN/ANIL) s'est terminé avec succès.

Logs : ${RUN_URL}"
          else
            export SUBJECT="🚨 lokt.fr — le refresh Carte des loyers a échoué"
            export BODY_TEXT="Le refresh automatique de la Carte des loyers a échoué.

Logs : ${RUN_URL}"
          fi
          curl -s -o /dev/null -w "Resend: %{http_code}\n" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg from "lokt.fr <contact@lokt.fr>" --arg to "matthieu.turbier@gmail.com" --arg subject "$SUBJECT" --arg text "$BODY_TEXT" '{from:$from,to:$to,subject:$subject,text:$text}')"
